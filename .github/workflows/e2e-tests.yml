name: E2E Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install npm dependencies
      run: npm install
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Start wp-env for E2E
      run: npm run start-env-e2e
    
    - name: Wait for WordPress to be ready
      run: |
        timeout 60 bash -c 'until curl -s http://localhost:8889 > /dev/null; do sleep 2; done'
        sleep 5  # Give a bit more time for full initialization
    
    - name: Activate plugin
      run: |
        npx wp-env run cli wp plugin activate custom-post-types-taxonomies
        npx wp-env run cli wp plugin list
    
    - name: Run E2E tests
      run: npm run test-e2e
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30