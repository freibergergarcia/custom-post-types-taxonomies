name: Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests (PHP ${{ matrix.php }})
    
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none
    
    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install npm dependencies
      run: npm ci
    
    - name: Start wp-env
      run: npm run start-env-ci
    
    - name: Install Composer dependencies in wp-env
      run: npm run composer-install
    
    - name: Run PHP unit tests
      run: npm run test-php

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install npm dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    
    - name: Start wp-env
      run: npm run start-env
    
    - name: Wait for WordPress to be ready
      run: |
        timeout 60 bash -c 'until curl -s http://localhost:8888 > /dev/null; do sleep 2; done'
        sleep 5  # Give a bit more time for full initialization
    
    - name: Activate plugin
      run: |
        npx wp-env run cli wp plugin activate custom-post-types-taxonomies
        npx wp-env run cli wp plugin list
    
    - name: Run E2E tests
      run: npm run test-e2e
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  code-quality:
    runs-on: ubuntu-latest
    name: Code Quality
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: none
    
    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader
    
    - name: Run PHPCS
      run: composer phpcs